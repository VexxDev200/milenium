[project]
name = "milenium"
version = "1.6.2"
description = "OSINT + локальные/TG базы — pip install milenium, данные в ~/.milenium/data"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "VexxDev200"}]
dependencies = [
    "requests",
    "aiohttp",
    "dnspython",
    "phonenumbers",
    "beautifulsoup4",
    "rich",
    "click",
    "python-whois",
    "psycopg2-binary",
    "maigret",
    "sherlock-project",
    "holehe",
    "telethon",
    "PicImageSearch",
    "aiogram>=3.0",
]

[project.scripts]
milenium = "milenium.cli:main"
milenium-build-library = "milenium.scripts.build_library:main"
milenium-build-library-full = "milenium.scripts.build_library_full:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["milenium*"]

[tool.setuptools.package-data]
milenium = ["bundled/*", "scripts/*"]