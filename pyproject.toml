[project]
name = "milenium"
version = "0.5.5"
description = "OSINT toolkit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "dnspython",
    "phonenumbers",
    "beautifulsoup4",
    "rich",
    "click",
    "python-whois",
    "psycopg2-binary",
]

[project.scripts]
milenium = "milenium.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["milenium*"]