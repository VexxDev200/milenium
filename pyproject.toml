[project]
name = "milenium"
version = "0.5.3"
description = "OSINT / dox / deanon toolkit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "dnspython",
    "phonenumbers",
    "beautifulsoup4",
    "rich",
    "click",
    "python-whois",
]

[project.scripts]
milenium = "milenium.cli:main"

[tool.setuptools.packages.find]
include = ["milenium*"]